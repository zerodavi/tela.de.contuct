<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Notícias</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;
  --surface:#161b22;
  --border:#21262d;
  --border2:#30363d;
  --text:#e6edf3;
  --muted:#8b949e;
  --accent:#58a6ff;
  --green:#238636;
  --green2:#2ea043;
  --red:#da3633;
  --gold:#f0e6d3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lora',serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(8px);
}
.header-logo{
  font-family:'Playfair Display',serif;
  font-size:1.5rem;
  color:var(--gold);
  letter-spacing:-.5px;
}
.header-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{
  padding:7px 16px;
  border-radius:20px;
  border:none;
  cursor:pointer;
  font-family:'Lora',serif;
  font-size:0.85rem;
  transition:all .2s;
  text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;
}
.btn-login{background:var(--green);color:#fff}
.btn-login:hover{background:var(--green2)}
.btn-logout{background:var(--border);color:var(--muted)}
.btn-logout:hover{color:var(--text)}
.btn-adm{background:var(--accent);color:var(--bg);font-weight:700}
.btn-adm:hover{opacity:.85}
.usuario-info{color:var(--muted);font-size:0.85rem}
.usuario-info strong{color:var(--text)}

/* SEARCH */
.search-wrap{padding:20px 24px 0;display:flex;justify-content:center}
.search-wrap input{
  width:100%;max-width:620px;
  padding:11px 20px;
  border-radius:30px;
  border:1px solid var(--border2);
  background:var(--surface);
  color:var(--text);
  font-family:'Lora',serif;
  font-size:0.95rem;
  outline:none;
  transition:border .2s;
}
.search-wrap input:focus{border-color:var(--accent)}

/* CARDS */
.container{padding:20px 24px;max-width:860px;margin:0 auto}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  display:flex;gap:16px;align-items:flex-start;
  position:relative;
  transition:border-color .2s;
}
.card:hover{border-color:var(--border2)}
.card img{
  width:110px;height:110px;
  object-fit:cover;border-radius:8px;
  flex-shrink:0;
}
.card-texto h2{
  font-family:'Playfair Display',serif;
  font-size:1.1rem;color:var(--gold);
  margin-bottom:6px;line-height:1.4;
}
.card-texto p{
  font-size:0.88rem;color:var(--muted);
  line-height:1.7;
}
.card-data{font-size:0.75rem;color:var(--border2);margin-top:6px}
.btn-excluir{
  position:absolute;top:10px;right:10px;
  background:var(--red);color:#fff;
  border:none;border-radius:6px;
  padding:5px 10px;cursor:pointer;
  font-size:0.78rem;font-family:'Lora',serif;
  display:none;transition:background .2s;
}
.btn-excluir:hover{background:#b62324}
.admin-mode .btn-excluir{display:block}
.sem-resultado{
  text-align:center;color:var(--muted);
  font-style:italic;padding:50px 0;
}

/* MODAL */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.75);z-index:100;
  justify-content:center;align-items:center;
}
.modal-overlay.ativo{display:flex}
.modal{
  background:var(--surface);
  border-radius:14px;padding:32px;
  width:100%;max-width:400px;
  border:1px solid var(--border2);
  animation:fadeUp .25s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.modal h2{
  font-family:'Playfair Display',serif;
  margin-bottom:22px;text-align:center;
  color:var(--gold);font-size:1.4rem;
}
.modal input{
  width:100%;padding:10px 14px;margin:7px 0;
  border-radius:8px;border:1px solid var(--border2);
  background:var(--bg);color:var(--text);
  font-family:'Lora',serif;font-size:0.95rem;outline:none;
  transition:border .2s;
}
.modal input:focus{border-color:var(--accent)}
.modal .btn-primary{
  width:100%;padding:11px;margin-top:12px;
  border-radius:8px;border:none;
  background:var(--green);color:#fff;
  font-family:'Lora',serif;font-size:1rem;cursor:pointer;
  transition:background .2s;
}
.modal .btn-primary:hover{background:var(--green2)}
.modal .btn-secondary{
  width:100%;padding:11px;margin-top:8px;
  border-radius:8px;border:none;
  background:var(--border);color:var(--muted);
  font-family:'Lora',serif;font-size:0.95rem;cursor:pointer;
}
.modal-erro{color:#f85149;font-size:0.85rem;text-align:center;margin-top:10px;min-height:18px}
.modal-toggle{text-align:center;margin-top:14px;font-size:0.85rem;color:var(--muted)}
.modal-toggle span{color:var(--accent);cursor:pointer}
.modal-toggle span:hover{text-decoration:underline}

/* SOCIAL */
.social-bar{
  display:flex;justify-content:center;align-items:center;
  gap:20px;padding:16px;
  background:var(--surface);border-top:1px solid var(--border);
  margin-top:40px;
}
.social-bar a{color:var(--muted);transition:color .2s;display:flex}
.social-bar a:hover{color:var(--accent)}
.social-bar svg{width:22px;height:22px;fill:currentColor}
footer{
  text-align:center;padding:12px;
  color:#4a5568;font-size:0.8rem;
  font-family:'Lora',serif;background:var(--surface);
}
</style>
</head>
<body>

<header>
  <span class="header-logo">📰 Portal de Notícias</span>
  <div class="header-nav" id="header-nav">
    <button class="btn btn-login" onclick="abrirModal()">Entrar / Cadastrar</button>
  </div>
</header>

<div class="search-wrap">
  <input type="text" id="pesquisa" placeholder="🔍 Pesquisar notícias por título..." oninput="filtrar()">
</div>

<div class="container" id="noticias"></div>

<!-- MODAL LOGIN / CADASTRO -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-titulo">Entrar</h2>
    <div id="campo-nome" style="display:none">
      <input type="text" id="inp-nome" placeholder="Seu nome completo">
    </div>
    <input type="email" id="inp-email" placeholder="E-mail">
    <input type="password" id="inp-senha" placeholder="Senha">
    <button class="btn-primary" onclick="submeter()">Confirmar</button>
    <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
    <p class="modal-erro" id="modal-erro"></p>
    <div class="modal-toggle">
      <span id="toggle-texto" onclick="alternarModo()">Não tem conta? Cadastre-se</span>
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
const client = createClient(
  "https://rmmpzrqzizqrcmpvhxvl.supabase.co",
  "sb_publishable_vvxAS_b3_iU_Vp4UfoeOLQ_rQBAm1yM"
);

let todasNoticias = [];
let modoCadastro = false;
let sessaoAtual = null;

/* -------- AUTH -------- */


async function getIsAdmin(userId) {
  if (!userId) return false;
  const { data } = await client
    .from('perfis')
    .select('is_admin')
    .eq('id', userId)
    .single();
  return data?.is_admin === true;
}

/* -------- MODAL -------- */
function abrirModal() {
  document.getElementById('modal').classList.add('ativo');
  document.getElementById('modal-erro').textContent = '';
}
function fecharModal() {
  document.getElementById('modal').classList.remove('ativo');
  limparCampos();
}
function alternarModo() {
  modoCadastro = !modoCadastro;
  document.getElementById('modal-titulo').textContent = modoCadastro ? 'Cadastrar' : 'Entrar';
  document.getElementById('campo-nome').style.display = modoCadastro ? 'block' : 'none';
  document.getElementById('toggle-texto').textContent = modoCadastro ? 'Já tem conta? Faça login' : 'Não tem conta? Cadastre-se';
  document.getElementById('modal-erro').textContent = '';
}
function limparCampos() {
  ['inp-nome','inp-email','inp-senha'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('modal-erro').textContent = '';
}

async function submeter() {
  const email = document.getElementById('inp-email').value.trim();
  const senha  = document.getElementById('inp-senha').value.trim();
  const erro   = document.getElementById('modal-erro');

  if (!email || !senha) { erro.textContent = 'Preencha todos os campos.'; return; }

  if (modoCadastro) {
    const nome = document.getElementById('inp-nome').value.trim();
    if (!nome) { erro.textContent = 'Informe seu nome.'; return; }

    const { data, error: signUpError } = await client.auth.signUp({
      email, password: senha,
      options: { data: { nome } }
    });

    if (signUpError) { erro.textContent = signUpError.message; return; }

    // Cria perfil na tabela perfis
    if (data.user) {
      await client.from('perfis').insert([{
  id: data.user.id,
  email: data.user.email,
  is_admin: false
}]);
    }

    alert('Cadastro realizado! Verifique seu e-mail para confirmar a conta.');
    alternarModo();
    limparCampos();

  } else {
    const { error: signInError } = await client.auth.signInWithPassword({ email, password: senha });
    if (signInError) { erro.textContent = 'E-mail ou senha inválidos.'; return; }
    fecharModal();
  }
}

/* -------- HEADER -------- */
async function atualizarHeader() {
  const nav = document.getElementById('header-nav');

  if (!sessaoAtual) {
    nav.innerHTML = `<button class="btn btn-login" onclick="abrirModal()">Entrar / Cadastrar</button>`;
    return;
  }

  const isAdmin = await getIsAdmin(sessaoAtual.user.id);
  const nome = sessaoAtual.user.user_metadata?.nome || sessaoAtual.user.email;

  const admBtn = isAdmin
    ? `<a href="adm.html" class="btn btn-adm">⚙️ Painel ADM</a>`
    : '';

  nav.innerHTML = `
    <span class="usuario-info">Olá, <strong>${nome}</strong></span>
    ${admBtn}
    <button class="btn btn-logout" onclick="logout()">Sair</button>
  `;
}

async function logout() {
  await client.auth.signOut();
}

/* -------- EXCLUIR NOTÍCIA -------- */
async function excluirNoticia(id) {
  if (!confirm('Tem certeza que deseja excluir esta notícia?')) return;
  const { error } = await client.from('noticias').delete().eq('id', id);
  if (error) { alert('Erro ao excluir: ' + error.message); return; }
  todasNoticias = todasNoticias.filter(n => n.id !== id);
  renderizar(todasNoticias);
}

/* -------- RENDERIZAR -------- */
async function renderizar(lista) {
  const div = document.getElementById('noticias');
  const isAdmin = sessaoAtual ? await getIsAdmin(sessaoAtual.user.id) : false;

  div.innerHTML = '';
  if (lista.length === 0) {
    div.innerHTML = '<p class="sem-resultado">Nenhuma notícia encontrada.</p>';
    return;
  }
  lista.forEach(n => {
    const data = n.created_at ? new Date(n.created_at).toLocaleDateString('pt-BR') : '';
    div.innerHTML += `
      <div class="card ${isAdmin ? 'admin-mode' : ''}">
        ${n.imagem ? `<img src="${n.imagem}" onerror="this.style.display='none'" alt="">` : ''}
        <div class="card-texto">
          <h2>${n.titulo}</h2>
          <p>${n.conteudo}</p>
          ${data ? `<p class="card-data">📅 ${data}</p>` : ''}
        </div>
        ${isAdmin ? `<button class="btn-excluir" onclick="excluirNoticia(${n.id})">🗑️ Excluir</button>` : ''}
      </div>
    `;
  });
}

function filtrar() {
  const termo = document.getElementById('pesquisa').value.toLowerCase();
  const filtradas = todasNoticias.filter(n => n.titulo.toLowerCase().includes(termo));
  renderizar(filtradas);
}

async function carregarNoticias() {
  const { data } = await client.from('noticias').select('*').order('id', { ascending: false });
  todasNoticias = data || [];
  renderizar(todasNoticias);
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});

carregarNoticias();


// FORÇA carregar usuário ao abrir página
(async () => {
  const { data: { session } } = await client.auth.getSession();
  sessaoAtual = session;
  await atualizarHeader();
})();
</script>





</body>
</html>
