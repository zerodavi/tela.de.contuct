<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Notícias</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#0d1117;color:#fff;margin:0}
header{padding:15px;background:#161b22;display:flex;justify-content:space-between}
button{padding:8px 12px;cursor:pointer}
.container{padding:20px}
.card{background:#161b22;margin-bottom:10px;padding:10px;border-radius:8px}
</style>
</head>
<body>

<header>
  <h2>📰 Portal</h2>
  <div id="header"></div>
</header>

<div class="container" id="noticias"></div>

<!-- LOGIN -->
<div id="loginBox" style="display:none;position:fixed;top:20%;left:50%;transform:translateX(-50%);background:#161b22;padding:20px;border-radius:10px">
  <h3>Login</h3>
  <input id="email" placeholder="email"><br><br>
  <input id="senha" type="password" placeholder="senha"><br><br>
  <button onclick="login()">Entrar</button>
  <button onclick="fecharLogin()">Cancelar</button>
  <p id="erro" style="color:red"></p>
</div>

<script>
const { createClient } = supabase;
const client = createClient(
  "https://rmmpzrqzizqrcmpvhxvl.supabase.co",
  "sb_publishable_vvxAS_b3_iU_Vp4UfoeOLQ_rQBAm1yM"
);

let sessaoAtual = null;

function abrirLogin(){document.getElementById('loginBox').style.display='block'}
function fecharLogin(){document.getElementById('loginBox').style.display='none'}

async function login(){
  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;
  const erro = document.getElementById('erro');

  const { error } = await client.auth.signInWithPassword({ email, password: senha });

  if(error){ erro.textContent = error.message; return; }

  const { data: { session } } = await client.auth.getSession();
  sessaoAtual = session;

  atualizarHeader();
  fecharLogin();
}

async function logout(){
  await client.auth.signOut();
}

async function atualizarHeader(){
  const header = document.getElementById('header');

  if(!sessaoAtual){
    header.innerHTML = `<button onclick="abrirLogin()">Entrar</button>`;
    return;
  }

  const { data } = await client.from('perfis').select('is_admin').eq('id', sessaoAtual.user.id).single();

  header.innerHTML = `
    <span>${sessaoAtual.user.email}</span>
    ${data?.is_admin ? '<a href="adm.html"><button>ADM</button></a>' : ''}
    <button onclick="logout()">Sair</button>
  `;
}

async function carregarNoticias(){
  const { data } = await client.from('noticias').select('*');
  const div = document.getElementById('noticias');
  div.innerHTML = '';

  data.forEach(n=>{
    div.innerHTML += `<div class="card"><h3>${n.titulo}</h3><p>${n.conteudo}</p></div>`;
  });
}

client.auth.onAuthStateChange((event, session) => {
  sessaoAtual = session;
  atualizarHeader();
});

(async () => {
  const { data: { session } } = await client.auth.getSession();
  sessaoAtual = session;
  atualizarHeader();
  carregarNoticias();
})();
</script>

</body>
</html>
