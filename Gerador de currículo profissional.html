<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Currículo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #1a1a2e;
      --ink-light: #4a4a6a;
      --ink-muted: #8888aa;
      --gold: #c9a84c;
      --gold-light: #f0d98a;
      --bg: #f5f3ef;
      --surface: #ffffff;
      --border: #e8e4dc;
      --accent: #2d6a4f;
      --accent-light: #e8f5f0;
      --danger: #c0392b;
      --blue: #1e3a5f;
      --panel-w: 420px;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      min-height: 100vh;
    }

    /* ── SIDEBAR PANEL ── */
    .painel {
      width: var(--panel-w);
      min-width: var(--panel-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      height: 100vh;
      overflow-y: auto;
      padding: 32px 28px;
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .painel::-webkit-scrollbar { width: 4px; }
    .painel::-webkit-scrollbar-track { background: transparent; }
    .painel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .panel-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .panel-logo .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--ink);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-logo .logo-icon svg { fill: var(--gold); }

    .panel-logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      color: var(--ink);
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .panel-logo span {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      color: var(--ink-muted);
      font-weight: 400;
      display: block;
      letter-spacing: 0.5px;
    }

    /* Section dividers */
    .panel-section {
      margin-bottom: 24px;
    }

    .panel-section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-light);
      display: block;
      margin-bottom: 5px;
      letter-spacing: 0.3px;
    }

    input[type="text"], input[type="email"], textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--ink);
      background: var(--bg);
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 10px;
      outline: none;
    }

    input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
      background: white;
    }

    input[type="file"] {
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--ink-muted);
      margin-bottom: 10px;
      cursor: pointer;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Buttons */
    button {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s;
    }

    .btn-add {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-light);
      color: var(--accent);
      padding: 8px 14px;
      margin-bottom: 12px;
      border: 1.5px solid rgba(45,106,79,0.2);
    }

    .btn-add:hover {
      background: var(--accent);
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(45,106,79,0.25);
    }

    .btn-remove {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #fef2f2;
      color: var(--danger);
      padding: 6px 10px;
      font-size: 11px;
      border: 1px solid #fde8e8;
      margin-top: 6px;
    }

    .btn-remove:hover {
      background: var(--danger);
      color: white;
    }

    .btn-print {
      width: 100%;
      background: var(--ink);
      color: white;
      font-size: 13px;
      font-weight: 600;
      padding: 13px 20px;
      border-radius: 10px;
      margin-top: 8px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-print:hover {
      background: var(--blue);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(26,26,46,0.3);
    }

    /* Entry boxes */
    .box {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      position: relative;
      transition: border-color 0.2s;
    }

    .box:hover { border-color: #ccc8be; }
    .box:focus-within { border-color: var(--gold); }

    /* ── MAIN AREA ── */
    .main {
      flex: 1;
      padding: 40px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(201,168,76,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(45,106,79,0.04) 0%, transparent 50%);
    }

    /* ── CURRICULO (A4) ── */
    .curriculo {
      width: 210mm;
      min-height: 297mm;
      background: white;
      box-shadow: 0 20px 60px rgba(26,26,46,0.15), 0 4px 12px rgba(26,26,46,0.08);
      display: flex;
      flex-direction: column;
      border-radius: 2px;
      overflow: hidden;
    }

    /* Header strip */
    .cv-header {
      background: var(--ink);
      padding: 36px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      position: relative;
      overflow: hidden;
    }

    .cv-header::before {
      content: '';
      position: absolute;
      top: -40px;
      right: 120px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(201,168,76,0.07);
      pointer-events: none;
    }

    .cv-header::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: 60px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(201,168,76,0.05);
      pointer-events: none;
    }

    .cv-header-info { flex: 1; position: relative; z-index: 1; }

    #cvNome {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      color: white;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    #cvCargo {
      font-size: 13px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .cv-contato-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 20px;
      margin-top: 14px;
    }

    .cv-contato-line span {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cv-contato-line span svg { opacity: 0.7; flex-shrink: 0; }

    #cvFoto {
      width: 110px;
      height: 110px;
      border-radius: 12px;
      object-fit: cover;
      border: 3px solid var(--gold);
      box-shadow: 0 0 0 4px rgba(201,168,76,0.2);
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    /* Body */
    .cv-body {
      display: grid;
      grid-template-columns: 1fr 200px;
      flex: 1;
    }

    .cv-main-col { padding: 32px 36px; border-right: 1px solid var(--border); }
    .cv-side-col { padding: 28px 24px; background: #fafaf8; }

    /* Section heading */
    .secao { margin-bottom: 28px; }

    .secao-titulo {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .secao-titulo::before {
      content: '';
      display: block;
      width: 16px;
      height: 2px;
      background: var(--gold);
      flex-shrink: 0;
    }

    .secao-titulo::after {
      content: '';
      display: block;
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Items */
    .cv-item { margin-bottom: 18px; }

    .cv-item h3 {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }

    .cv-item .cv-meta {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 2px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .cv-item .cv-meta strong { color: var(--ink-light); font-weight: 500; }

    .cv-item .cv-meta .periodo-badge {
      background: #f0ede7;
      color: var(--ink-light);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    .cv-item p {
      font-size: 12.5px;
      color: var(--ink-light);
      line-height: 1.6;
      margin-top: 6px;
    }

    /* Resumo */
    #cvResumo {
      font-size: 13px;
      color: var(--ink-light);
      line-height: 1.75;
    }

    /* Sidebar sections */
    .side-secao { margin-bottom: 24px; }

    .side-secao-titulo {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    #cvHabilidades { list-style: none; padding: 0; }

    #cvHabilidades li {
      font-size: 12px;
      color: var(--ink-light);
      padding: 5px 0;
      border-bottom: 1px dashed var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #cvHabilidades li::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    /* ══════════════════════════════════════════════════
       PRINT / PDF — PRESERVAÇÃO VISUAL COMPLETA
       ══════════════════════════════════════════════════ */

    @media print {

      /* ── Configuração da página A4 ── */
      @page {
        size: A4 portrait;
        margin: 0;
      }

      /* ── Forçar impressão de cores em todos os elementos ── */
      *,
      *::before,
      *::after {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }

      /* ── Reset do layout de tela ── */
      html, body {
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        display: block !important;
        overflow: visible !important;
      }

      /* ── Ocultar painel lateral de edição ── */
      .painel {
        display: none !important;
      }

      /* ── Área principal: sem centralização, preenche tudo ── */
      .main {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        background: none !important;
        width: 100% !important;
        min-height: unset !important;
        align-items: unset !important;
        justify-content: unset !important;
      }

      /* ── Currículo: preenche toda a largura da página ── */
      .curriculo {
        box-shadow: none !important;
        width: 100% !important;
        max-width: 100% !important;
        min-height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        border-radius: 0 !important;
        overflow: visible !important;
        display: flex !important;
        flex-direction: column !important;
        float: none !important;
        position: static !important;
        page-break-inside: avoid;
      }

      /* ══ 1. CABEÇALHO ESCURO + PSEUDO-ELEMENTOS DECORATIVOS ══ */
      .cv-header {
        background: #1a1a2e !important;
        background-color: #1a1a2e !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
        position: relative !important;
        overflow: hidden !important;
        padding: 36px 40px !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        gap: 24px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      /* Círculos decorativos dourados do cabeçalho */
      .cv-header::before {
        content: '' !important;
        position: absolute !important;
        top: -40px !important;
        right: 120px !important;
        width: 200px !important;
        height: 200px !important;
        border-radius: 50% !important;
        background: rgba(201,168,76,0.07) !important;
        background-color: rgba(201,168,76,0.07) !important;
        pointer-events: none !important;
        display: block !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .cv-header::after {
        content: '' !important;
        position: absolute !important;
        bottom: -60px !important;
        left: 60px !important;
        width: 140px !important;
        height: 140px !important;
        border-radius: 50% !important;
        background: rgba(201,168,76,0.05) !important;
        background-color: rgba(201,168,76,0.05) !important;
        pointer-events: none !important;
        display: block !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* ── Nome no cabeçalho ── */
      #cvNome {
        font-family: 'Playfair Display', serif !important;
        font-size: 32px !important;
        font-weight: 700 !important;
        color: #ffffff !important;
        line-height: 1.1 !important;
        letter-spacing: -0.5px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* ── Cargo ── */
      #cvCargo {
        color: #c9a84c !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* ══ 2. ÍCONES SVG + LINHA DE CONTATO ══ */
      .cv-contato-line {
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 6px 20px !important;
        margin-top: 14px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .cv-contato-line span {
        font-size: 12px !important;
        color: rgba(255,255,255,0.75) !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 5px !important;
        white-space: nowrap !important;
        vertical-align: middle !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .cv-contato-line span svg {
        display: inline-block !important;
        width: 11px !important;
        height: 11px !important;
        min-width: 11px !important;
        opacity: 0.85 !important;
        flex-shrink: 0 !important;
        vertical-align: middle !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* ── Foto de perfil ── */
      #cvFoto {
        width: 110px !important;
        height: 110px !important;
        border-radius: 12px !important;
        object-fit: cover !important;
        border: 3px solid #c9a84c !important;
        box-shadow: 0 0 0 4px rgba(201,168,76,0.2) !important;
        position: relative !important;
        z-index: 1 !important;
        flex-shrink: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* ══ BODY DO CURRÍCULO ══ */
      .cv-body {
        display: grid !important;
        grid-template-columns: 1fr 200px !important;
        flex: 1 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .cv-main-col {
        padding: 32px 36px !important;
        border-right: 1px solid #e8e4dc !important;
      }

      .cv-side-col {
        padding: 28px 24px !important;
        background: #fafaf8 !important;
        background-color: #fafaf8 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* ══ 3. TÍTULOS DAS SEÇÕES + PSEUDO-ELEMENTOS ══ */
      .secao {
        margin-bottom: 24px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .secao-titulo {
        font-family: 'Playfair Display', serif !important;
        font-size: 14px !important;
        font-weight: 700 !important;
        color: #1a1a2e !important;
        letter-spacing: 0.5px !important;
        text-transform: uppercase !important;
        display: flex !important;
        align-items: center !important;
        gap: 8px !important;
        margin-bottom: 14px !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Traço dourado antes do título */
      .secao-titulo::before {
        content: '' !important;
        display: block !important;
        width: 16px !important;
        min-width: 16px !important;
        height: 2px !important;
        background: #c9a84c !important;
        background-color: #c9a84c !important;
        flex-shrink: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Linha divisória após o título */
      .secao-titulo::after {
        content: '' !important;
        display: block !important;
        flex: 1 !important;
        height: 1px !important;
        background: #e8e4dc !important;
        background-color: #e8e4dc !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* ══ Itens de experiência e formação ══ */
      .cv-item {
        margin-bottom: 16px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .cv-item h3 {
        font-size: 14px !important;
        font-weight: 600 !important;
        color: #1a1a2e !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .cv-item .cv-meta {
        font-size: 12px !important;
        color: #8888aa !important;
        margin-top: 2px !important;
        display: flex !important;
        gap: 8px !important;
        align-items: center !important;
        flex-wrap: wrap !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .cv-item .cv-meta strong {
        color: #4a4a6a !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .cv-item .cv-meta .periodo-badge {
        background: #f0ede7 !important;
        background-color: #f0ede7 !important;
        color: #4a4a6a !important;
        font-size: 10px !important;
        font-weight: 600 !important;
        padding: 2px 8px !important;
        border-radius: 20px !important;
        letter-spacing: 0.3px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* ══ 4. HABILIDADES: MARCADORES DOURADOS ══ */
      .side-secao {
        margin-bottom: 20px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .side-secao-titulo {
        font-size: 9px !important;
        font-weight: 700 !important;
        letter-spacing: 1.8px !important;
        text-transform: uppercase !important;
        color: #c9a84c !important;
        margin-bottom: 10px !important;
        padding-bottom: 6px !important;
        border-bottom: 1px solid #e8e4dc !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      #cvHabilidades {
        list-style: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      #cvHabilidades li {
        font-size: 12px !important;
        color: #4a4a6a !important;
        padding: 5px 0 !important;
        border-bottom: 1px dashed #e8e4dc !important;
        display: flex !important;
        align-items: center !important;
        gap: 6px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Bolinhas douradas das habilidades */
      #cvHabilidades li::before {
        content: '' !important;
        display: inline-block !important;
        width: 5px !important;
        min-width: 5px !important;
        height: 5px !important;
        border-radius: 50% !important;
        background: #c9a84c !important;
        background-color: #c9a84c !important;
        flex-shrink: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* ── Evitar quebras indesejadas ── */
      .cv-header-info { page-break-inside: avoid; break-inside: avoid; }
      .cv-contato-line { page-break-inside: avoid; break-inside: avoid; }
    }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      .painel { width: 100%; min-width: unset; height: auto; position: static; }
      .main { padding: 20px; }
      .curriculo { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="painel">
    <div class="panel-logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/></svg>
      </div>
      <div>
        <h1>CurrículoPro</h1>
        <span>Gerador de currículo profissional</span>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Informações Pessoais</div>
      <label>Nome Completo</label>
      <input type="text" id="nome" placeholder="Ex: Ana Paula Souza" oninput="atualizar()">
      <label>Cargo / Título Profissional</label>
      <input type="text" id="cargo" placeholder="Ex: Designer UX Senior" oninput="atualizar()">
      <label>E-mail</label>
      <input type="text" id="email" placeholder="email@exemplo.com" oninput="atualizar()">
      <label>Telefone</label>
      <input type="text" id="telefone" placeholder="(00) 00000-0000" oninput="atualizar()">
      <label>Endereço / Cidade</label>
      <input type="text" id="endereco" placeholder="São Paulo, SP" oninput="atualizar()">
      <label>Foto de Perfil</label>
      <input type="file" id="foto" accept="image/*" onchange="carregarFoto(event)">
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Resumo Profissional</div>
      <textarea id="resumo" rows="4" placeholder="Breve descrição da sua trajetória, objetivos e diferenciais..." oninput="enforcarQuebraResumo(this); atualizar()"></textarea>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Experiências</div>
      <div id="experiencias"></div>
      <button class="btn-add" onclick="adicionarExperiencia()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Adicionar Experiência
      </button>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Formação</div>
      <div id="formacoes"></div>
      <button class="btn-add" onclick="adicionarFormacao()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Adicionar Formação
      </button>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Habilidades</div>
      <div id="habilidades"></div>
      <button class="btn-add" onclick="adicionarHabilidade()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Adicionar Habilidade
      </button>
    </div>

    <button class="btn-print" onclick="document.fonts.ready.then(()=>window.print())">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Baixar / Imprimir PDF
    </button>
  </div>

  <!-- ── CURRÍCULO PREVIEW ── -->
  <div class="main">
    <div class="curriculo" id="curriculo">

      <div class="cv-header">
        <div class="cv-header-info">
          <div id="cvNome">Seu Nome</div>
          <div id="cvCargo">Cargo Profissional</div>
          <div class="cv-contato-line" id="cvContato"></div>
        </div>
        <img id="cvFoto" src="https://placehold.co/110x110/2d2d4e/c9a84c?text=Foto" style="width:110px;height:110px;border-radius:12px;object-fit:cover;border:3px solid #c9a84c;box-shadow:0 0 0 4px rgba(201,168,76,0.2);flex-shrink:0;position:relative;z-index:1;">
      </div>

      <div class="cv-body">
        <div class="cv-main-col">

          <div class="secao">
            <div class="secao-titulo">Resumo Profissional</div>
            <p id="cvResumo">Escreva seu resumo profissional no painel ao lado.</p>
          </div>

          <div class="secao">
            <div class="secao-titulo">Experiência Profissional</div>
            <div id="cvExperiencias"></div>
          </div>

          <div class="secao">
            <div class="secao-titulo">Formação Acadêmica</div>
            <div id="cvFormacoes"></div>
          </div>

        </div>

        <div class="cv-side-col">
          <div class="side-secao">
            <div class="side-secao-titulo">Habilidades</div>
            <ul id="cvHabilidades"></ul>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function atualizar() {
      document.getElementById('cvNome').innerText = document.getElementById('nome').value || 'Seu Nome';
      document.getElementById('cvCargo').innerText = document.getElementById('cargo').value || 'Cargo Profissional';

      const email = document.getElementById('email').value;
      const tel = document.getElementById('telefone').value;
      const end = document.getElementById('endereco').value;

      const iconEmail = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" style="display:inline-block;vertical-align:middle;flex-shrink:0"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>`;
      const iconTel = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l.92-.86a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;
      const iconEnd = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;

      let contato = '';
      if (email) contato += `<span>${iconEmail} ${email}</span>`;
      if (tel) contato += `<span>${iconTel} ${tel}</span>`;
      if (end) contato += `<span>${iconEnd} ${end}</span>`;
      document.getElementById('cvContato').innerHTML = contato;

      document.getElementById('cvResumo').innerText = document.getElementById('resumo').value || 'Escreva seu resumo profissional no painel ao lado.';

      atualizarExperiencias();
      atualizarFormacoes();
      atualizarHabilidades();
    }

    function adicionarExperiencia() {
      const container = document.getElementById('experiencias');
      const div = document.createElement('div');
      div.className = 'box experiencia';
      div.innerHTML = `
        <label>Empresa</label>
        <input type="text" placeholder="Nome da empresa" class="empresa" oninput="atualizar()">
        <label>Cargo</label>
        <input type="text" placeholder="Cargo exercido" class="cargoExp" oninput="atualizar()">
        <label>Período</label>
        <input type="text" placeholder="Jan 2021 – Dez 2023" class="periodo" oninput="atualizar()">
        <label>Descrição</label>
        <textarea placeholder="Principais atividades e conquistas..." class="descricao" oninput="enforcarQuebra(this); atualizar()"></textarea>
        <button class="btn-remove" onclick="this.parentElement.remove(); atualizar()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Remover
        </button>
      `;
      container.appendChild(div);
    }

    function atualizarExperiencias() {
      const cv = document.getElementById('cvExperiencias');
      cv.innerHTML = '';
      document.querySelectorAll('.experiencia').forEach(exp => {
        const empresa = exp.querySelector('.empresa').value;
        const cargo = exp.querySelector('.cargoExp').value;
        const periodo = exp.querySelector('.periodo').value;
        const descricao = exp.querySelector('.descricao').value;
        if (!cargo && !empresa) return;
        cv.innerHTML += `
          <div class="cv-item">
            <h3>${cargo || 'Cargo'}</h3>
            <div class="cv-meta">
              <strong>${empresa || 'Empresa'}</strong>
              ${periodo ? `<span class="periodo-badge">${periodo}</span>` : ''}
            </div>
            ${descricao ? `<p>${descricao}</p>` : ''}
          </div>
        `;
      });
    }

    function adicionarFormacao() {
      const container = document.getElementById('formacoes');
      const div = document.createElement('div');
      div.className = 'box formacao';
      div.innerHTML = `
        <label>Instituição</label>
        <input type="text" placeholder="Nome da instituição" class="instituicao" oninput="atualizar()">
        <label>Curso</label>
        <input type="text" placeholder="Nome do curso" class="curso" oninput="atualizar()">
        <label>Período</label>
        <input type="text" placeholder="2018 – 2022" class="periodoForm" oninput="atualizar()">
        <button class="btn-remove" onclick="this.parentElement.remove(); atualizar()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Remover
        </button>
      `;
      container.appendChild(div);
    }

    function atualizarFormacoes() {
      const cv = document.getElementById('cvFormacoes');
      cv.innerHTML = '';
      document.querySelectorAll('.formacao').forEach(form => {
        const instituicao = form.querySelector('.instituicao').value;
        const curso = form.querySelector('.curso').value;
        const periodo = form.querySelector('.periodoForm').value;
        if (!curso && !instituicao) return;
        cv.innerHTML += `
          <div class="cv-item">
            <h3>${curso || 'Curso'}</h3>
            <div class="cv-meta">
              <strong>${instituicao || 'Instituição'}</strong>
              ${periodo ? `<span class="periodo-badge">${periodo}</span>` : ''}
            </div>
          </div>
        `;
      });
    }

    function adicionarHabilidade() {
      const container = document.getElementById('habilidades');
      const div = document.createElement('div');
      div.className = 'box habilidade';
      div.innerHTML = `
        <input type="text" placeholder="Ex: Figma, React, Liderança..." class="hab" oninput="atualizar()">
        <button class="btn-remove" onclick="this.parentElement.remove(); atualizar()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Remover
        </button>
      `;
      container.appendChild(div);
    }

    function atualizarHabilidades() {
      const cv = document.getElementById('cvHabilidades');
      cv.innerHTML = '';
      document.querySelectorAll('.habilidade').forEach(hab => {
        const texto = hab.querySelector('.hab').value;
        if (texto) cv.innerHTML += `<li>${texto}</li>`;
      });
    }

    function carregarFoto(event) {
      const reader = new FileReader();
      reader.onload = function () {
        document.getElementById('cvFoto').src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    // ── AUTO-WRAP: quebra linha a cada 46 caracteres ──
    function wrapText(texto, limite) {
      const linhasOriginais = texto.split('\n');
      const resultado = [];

      for (const linha of linhasOriginais) {
        if (linha.length <= limite) {
          resultado.push(linha);
          continue;
        }

        let restante = linha;
        while (restante.length > limite) {
          let quebraEm = limite;
          const ultimoEspaco = restante.lastIndexOf(' ', limite - 1);
          if (ultimoEspaco > 0) quebraEm = ultimoEspaco;

          resultado.push(restante.substring(0, quebraEm));
          restante = restante.substring(quebraEm).replace(/^ /, '');
        }
        resultado.push(restante);
      }

      return resultado.join('\n');
    }

    function enforcarQuebraResumo(el) {
      enforcarQuebraComLimite(el, 40);
    }

    function enforcarQuebra(el) {
      enforcarQuebraComLimite(el, 46);
    }

    function enforcarQuebraComLimite(el, limite) {
      const cursorAntes = el.selectionStart;
      const valorOriginal = el.value;
      const valorWrapped = wrapText(valorOriginal, limite);

      if (valorWrapped === valorOriginal) return;

      let posOrig = 0, posWrap = 0, novoCursor = cursorAntes;

      while (posOrig < cursorAntes && posWrap < valorWrapped.length) {
        if (valorOriginal[posOrig] === valorWrapped[posWrap]) {
          posOrig++; posWrap++;
        } else if (valorWrapped[posWrap] === '\n') {
          novoCursor++;
          posWrap++;
        } else {
          posOrig++; posWrap++;
        }
      }

      el.value = valorWrapped;
      el.selectionStart = el.selectionEnd = novoCursor;
    }

    // Init defaults
    adicionarExperiencia();
    adicionarFormacao();
    adicionarHabilidade();
  </script>

</body>
</html>
