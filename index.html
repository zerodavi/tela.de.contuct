<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Portal de Notícias</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b0f;
  --surface: #0e1318;
  --surface2: #131920;
  --border: #1e2730;
  --border2: #28333d;
  --text: #dce8f0;
  --muted: #6a7f8e;
  --muted2: #4a5d6b;
  --accent: #c8a96e;
  --accent2: #e2c898;
  --accent-dim: rgba(200,169,110,0.10);
  --red: #c0392b;
  --green: #1a6b3a;
  --green2: #21854a;
  --white: #f5f0e8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
img { max-width: 100%; display: block; }

body {
  font-family: 'Cormorant Garamond', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(200,169,110,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 110%, rgba(200,169,110,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ── TOP BAR ── */
.topbar {
  border-bottom: 1px solid var(--border);
  padding: 6px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
  position: relative;
  z-index: 10;
}
#data-hora { color: var(--accent); }

/* ── HEADER ── */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(8,11,15,0.94);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}
.logo {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
  text-decoration: none;
}
.logo-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.7rem;
  font-weight: 700;
  color: var(--accent2);
  letter-spacing: 0.04em;
  line-height: 1;
}
.logo-sub {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.55rem;
  letter-spacing: 0.3em;
  color: var(--muted);
  text-transform: uppercase;
}
#header-user {
  display: flex;
  align-items: center;
  gap: 10px;
}
.user-greeting {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.78rem;
  color: var(--muted);
  letter-spacing: 0.05em;
}
.user-greeting b { color: var(--accent2); font-weight: 600; }

.btn {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: none;
  border-radius: 2px;
  cursor: pointer;
  padding: 8px 18px;
  transition: all 0.25s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-login { background: var(--accent); color: #080b0f; font-weight: 600; }
.btn-login:hover { background: var(--accent2); transform: translateY(-1px); }
.btn-logout { background: transparent; border: 1px solid var(--border2); color: var(--muted); }
.btn-logout:hover { border-color: var(--muted); color: var(--text); }
.btn-adm { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
.btn-adm:hover { background: var(--accent-dim); }

/* ── HERO ── */
.hero {
  text-align: center;
  padding: 52px 20px 36px;
  position: relative;
  z-index: 1;
  max-width: 700px;
  margin: 0 auto;
}
.hero-eyebrow {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}
.hero h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.2rem, 5vw, 3.5rem);
  font-weight: 300;
  color: var(--white);
  line-height: 1.15;
  margin-bottom: 12px;
}
.hero h1 em { font-style: italic; color: var(--accent2); }
.hero-divider {
  width: 50px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  margin: 18px auto 0;
}

/* ── SEARCH BAR ── */
.search-wrap {
  max-width: 620px;
  margin: 28px auto 0;
  padding: 0 20px;
  position: relative;
  z-index: 1;
}
.search-box {
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 3px;
  overflow: hidden;
  transition: border-color 0.25s, box-shadow 0.25s;
}
.search-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(200,169,110,0.1);
}
.search-icon {
  padding: 0 14px;
  color: var(--muted2);
  font-size: 1rem;
  flex-shrink: 0;
}
#campo-busca {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  padding: 12px 4px;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.06em;
  color: var(--text);
}
#campo-busca::placeholder { color: var(--muted2); }
.search-clear {
  background: none;
  border: none;
  color: var(--muted2);
  cursor: pointer;
  padding: 0 14px;
  font-size: 1rem;
  line-height: 1;
  display: none;
  transition: color 0.2s;
}
.search-clear:hover { color: var(--accent); }
.search-clear.visible { display: block; }

/* ── CONTAINER ── */
.container {
  max-width: 860px;
  margin: 0 auto;
  padding: 32px 30px 60px;
  position: relative;
  z-index: 1;
}

/* ── SECTION HEADER ── */
.section-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.section-label {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
}
.section-line { flex: 1; height: 1px; background: var(--border); }
.section-count {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.65rem;
  color: var(--muted2);
  letter-spacing: 0.1em;
  white-space: nowrap;
}

/* ── LISTA DE NOTÍCIAS ── */
#lista-noticias {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  width: 100%;
}

.card {
  background: var(--surface);
  display: flex;
  flex-direction: row;
  align-items: stretch;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
  overflow: hidden;
  min-height: 110px;
  width: 100%;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
.card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent-dim);
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
}
.card:hover { background: var(--surface2); }
.card:hover::after { opacity: 1; }
.card:active { background: var(--surface2); }
.card:active::after { opacity: 1; }

/* Wrapper da imagem — garante tamanho fixo e sem overflow */
.card-thumb-wrap {
  width: 110px;
  min-width: 110px;
  max-width: 110px;
  flex-shrink: 0;
  align-self: stretch;
  overflow: hidden;
  position: relative;
  display: flex;
}

.card-thumb {
  width: 100%;
  height: 100%;
  min-height: 110px;
  flex-shrink: 0;
  object-fit: cover;
  object-position: center;
  display: block;
  filter: brightness(0.9) saturate(0.82);
  transition: filter 0.3s;
}
.card:hover .card-thumb { filter: brightness(1) saturate(0.95); }

.card-thumb-ph {
  width: 100%;
  min-height: 110px;
  flex: 1;
  background: linear-gradient(135deg, var(--surface2) 0%, var(--border) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  color: var(--muted2);
}


/* Linha divisória vertical */
.card-divider {
  width: 1px;
  min-width: 1px;
  background: var(--border);
  flex-shrink: 0;
  align-self: stretch;
}

/* Corpo do card */
.card-body {
  flex: 1;
  min-width: 0;
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  overflow: hidden;
}
.card-category {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--white);
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}
.card-text {
  font-size: 0.88rem;
  color: var(--muted);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 2px;
  gap: 8px;
}
.card-date {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.06em;
  color: var(--muted2);
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-read {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  color: var(--accent);
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
  /* sempre visível no mobile, hover no desktop */
  opacity: 1;
}
@media (hover: hover) {
  .card-read { opacity: 0; }
  .card:hover .card-read { opacity: 1; }
}


/* ── SKELETON ── */
.skeleton-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.skeleton-item {
  background: var(--surface);
  display: flex;
  align-items: stretch;
  height: 110px;
}
.skeleton-item:first-child { height: 160px; }
.skel-thumb {
  width: 110px;
  height: 100%;
  flex-shrink: 0;
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
.skeleton-item:first-child .skel-thumb { width: 220px; }
.skel-body {
  flex: 1;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
}
.skel-line {
  height: 11px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
.skel-line.short { width: 38%; height: 8px; }
.skel-line.long  { width: 88%; }
.skel-line.mid   { width: 62%; }
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── EMPTY / NO RESULT ── */
.empty-state, .no-result {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  background: var(--surface);
}
.empty-icon, .no-result span { font-size: 2.5rem; display: block; margin-bottom: 14px; }
.empty-state h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; color: var(--text); margin-bottom: 6px; }
.empty-state p, .no-result p { font-size: 0.9rem; }
.no-result b { color: var(--accent2); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 32px 30px;
  width: 100%;
  max-width: 400px;
  position: relative;
  transform: translateY(10px);
  transition: transform 0.25s;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-close {
  position: absolute; top: 14px; right: 16px;
  background: none; border: none;
  color: var(--muted); font-size: 1.1rem;
  cursor: pointer; transition: color 0.2s;
}
.modal-close:hover { color: var(--text); }
.modal-header { margin-bottom: 24px; }
.modal-eyebrow {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}
.modal-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.8rem;
  font-weight: 300;
  color: var(--white);
}
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: 10px 12px;
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}
.field input:focus { border-color: var(--accent); }
#modal-erro {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.75rem;
  color: #e87070;
  margin-bottom: 12px;
  min-height: 18px;
}
.btn-submit {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #080b0f;
  border: none;
  border-radius: 2px;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}
.btn-submit:hover { background: var(--accent2); transform: translateY(-1px); }
.modal-toggle {
  margin-top: 18px;
  text-align: center;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.modal-toggle span:last-child {
  color: var(--accent); cursor: pointer; margin-left: 6px; transition: color 0.2s;
}
.modal-toggle span:last-child:hover { color: var(--accent2); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 28px; right: 28px;
  background: var(--surface);
  border: 1px solid var(--accent);
  color: var(--accent2);
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  padding: 12px 20px;
  border-radius: 3px;
  display: none;
  animation: fadeInUp 0.3s ease;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  z-index: 300;
}
.toast.show { display: block; }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border);
  padding: 28px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  position: relative;
  z-index: 1;
}
.footer-top {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.footer-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  color: var(--accent);
  letter-spacing: 0.05em;
}
.footer-copy {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  color: var(--muted2);
  text-transform: uppercase;
}
.footer-social { display: flex; align-items: center; gap: 8px; }
.social-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.25s;
  text-decoration: none;
  color: var(--muted);
}
.social-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); transform: translateY(-2px); }
.social-btn svg { width: 16px; height: 16px; fill: currentColor; }

/* ── MODAL LEITURA DE NOTÍCIA ── */
.modal-noticia-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  overflow-y: auto;
  padding: 40px 20px;
}
.modal-noticia-overlay.open { opacity: 1; pointer-events: all; }

.modal-noticia {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  width: 100%;
  max-width: 780px;
  position: relative;
  transform: translateY(20px);
  transition: transform 0.3s;
  overflow: hidden;
  margin: auto;
}
.modal-noticia-overlay.open .modal-noticia { transform: translateY(0); }

.modal-noticia-close {
  position: absolute; top: 16px; right: 18px;
  background: rgba(8,11,15,0.7); border: 1px solid var(--border2);
  color: var(--muted); font-size: 1rem;
  cursor: pointer; transition: all 0.2s;
  border-radius: 50%; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  z-index: 10;
}
.modal-noticia-close:hover { color: var(--text); border-color: var(--muted); background: rgba(8,11,15,0.9); }

.modal-noticia-img {
  width: 100%;
  max-height: 340px;
  object-fit: cover;
  display: block;
  filter: brightness(0.88) saturate(0.8);
}

.modal-noticia-body {
  padding: 32px 36px 40px;
}

.modal-noticia-category {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
  display: block;
}

.modal-noticia-titulo {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 600;
  color: var(--white);
  line-height: 1.2;
  margin-bottom: 14px;
}

.modal-noticia-meta {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  color: var(--muted2);
  text-transform: uppercase;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.modal-noticia-conteudo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem;
  color: var(--text);
  line-height: 1.8;
  white-space: pre-wrap;
}

/* ── RESPONSIVE ── */
@media (max-width: 680px) {
  .topbar { display: none; }
  .header-inner { padding: 0 16px; }
  .container { padding: 20px 16px 50px; }
  .hero { padding: 36px 16px 24px; }
  .search-wrap { padding: 0 16px; margin-top: 20px; }

  /* Cards — todos iguais no mobile */
  .card { min-height: 90px; }
  .card-thumb {
    width: 88px;
    min-width: 88px;
    max-width: 88px;
    min-height: 90px;
  }
  .card-thumb-ph {
    width: 88px;
    min-width: 88px;
    max-width: 88px;
    min-height: 90px;
    font-size: 1.3rem;
  }
  .card-body { padding: 10px 12px; gap: 4px; }
  .card-title { font-size: 0.98rem; }
  .card-text { display: none; } /* esconde resumo no mobile para economizar espaço */
  .card-date { font-size: 0.58rem; }

  /* Skeleton */
  .skel-thumb { width: 88px; min-width: 88px; }
  .skeleton-item { height: 90px; }
  .skeleton-item:first-child { height: 90px; }
  .skeleton-item:first-child .skel-thumb { width: 88px; }

  .footer-top { flex-direction: column; gap: 10px; text-align: center; }
  footer { padding: 24px 16px; }

  /* Modal notícia no mobile */
  .modal-noticia-overlay { padding: 0; align-items: flex-end; }
  .modal-noticia { border-radius: 12px 12px 0 0; max-height: 92vh; overflow-y: auto; }
  .modal-noticia-img { max-height: 220px; }
  .modal-noticia-body { padding: 22px 20px 36px; }

  .modal-noticia-conteudo { font-size: 1.05rem; }
}

@media (min-width: 681px) and (max-width: 900px) {
  .card-thumb { width: 100px; min-width: 100px; max-width: 100px; min-height: 110px; }
  .card-thumb-ph { width: 100px; min-width: 100px; max-width: 100px; min-height: 110px; }
}

      <span class="modal-noticia-category">Notícia</span>

    </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" onclick="fecharModal()" aria-label="Fechar">✕</button>
    <div class="modal-header">
      <div class="modal-eyebrow" id="modal-eyebrow">Acesso à conta</div>
      <div class="modal-title" id="modal-title">Entrar</div>
    </div>
    <div class="field" id="field-nome" style="display:none">
      <label>Seu nome</label>
      <input type="text" id="nome" placeholder="Como quer ser chamado?">
    </div>
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••">
    </div>
    <div id="modal-erro"></div>
    <button class="btn-submit" onclick="enviar()">Confirmar</button>
    <div class="modal-toggle">
      <span id="toggle-label">Não tem conta?</span>
      <span onclick="toggleModo()">Cadastre-se</span>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const { createClient } = supabase;
const client = createClient(
  "https://tmixcpmmaozlwwwiusci.supabase.co",
  "sb_publishable_VJEVbKvYerNLxk39ea1IUQ_dK0Pu9hR"
);

let sessaoAtual  = null;
let cadastro     = false;
let todasNoticias = [];

/* ── DATA/HORA ── */
function atualizarRelogio() {
  const agora = new Date();
  const opts  = { weekday:'long', day:'numeric', month:'long', year:'numeric' };
  document.getElementById('data-hora').textContent =
    agora.toLocaleDateString('pt-BR', opts) + ' · ' +
    agora.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}
atualizarRelogio();
setInterval(atualizarRelogio, 60000);

/* ── LEITURA DE NOTÍCIA ── */
function abrirNoticia(id) {
  const n = todasNoticias.find(x => x.id === id);
  if (!n) return;

  const imgEl = document.getElementById('noticia-img');
  if (n.imagem) {
    imgEl.src = n.imagem;
    imgEl.alt = n.titulo;
    imgEl.style.display = 'block';
    imgEl.onerror = () => { imgEl.style.display = 'none'; };
  } else {
    imgEl.style.display = 'none';
  }

  document.getElementById('noticia-titulo').textContent = n.titulo;
  document.getElementById('noticia-meta').textContent = formatarData(n.created_at) || 'Publicado recentemente';
  document.getElementById('noticia-conteudo').textContent = n.conteudo;

  const overlay = document.getElementById('modal-noticia-overlay');
  overlay.classList.add('open');
  overlay.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function fecharNoticia() {
  document.getElementById('modal-noticia-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal-noticia-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) fecharNoticia();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharNoticia();
});

/* ── MODAL LOGIN ── */
function abrirModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('email').focus();
}
function fecharModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-erro').textContent = '';
}
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) fecharModal();
});

function toggleModo() {
  cadastro = !cadastro;
  document.getElementById('modal-title').textContent   = cadastro ? 'Criar conta'   : 'Entrar';
  document.getElementById('modal-eyebrow').textContent = cadastro ? 'Novo cadastro' : 'Acesso à conta';
  document.getElementById('field-nome').style.display  = cadastro ? 'block' : 'none';
  document.getElementById('toggle-label').textContent  = cadastro ? 'Já tem conta?' : 'Não tem conta?';
  document.querySelector('.modal-toggle span:last-child').textContent = cadastro ? 'Faça login' : 'Cadastre-se';
  document.getElementById('modal-erro').textContent = '';
}

function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = err ? '#c0392b' : 'var(--accent)';
  el.style.color = err ? '#e87070' : 'var(--accent2)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3200);
}

async function enviar() {
  const email  = document.getElementById('email').value.trim();
  const senha  = document.getElementById('senha').value;
  const erroEl = document.getElementById('modal-erro');
  erroEl.textContent = '';

  if (!email || !senha) { erroEl.textContent = 'Preencha todos os campos.'; return; }

  if (cadastro) {
    const nome = document.getElementById('nome').value.trim();
    const { data, error } = await client.auth.signUp({
      email, password: senha,
      options: { data: { nome }, emailRedirectTo: null }
    });
    if (error) {
      erroEl.textContent = error.status === 429 || error.message.toLowerCase().includes('email')
        ? 'Limite de e-mails atingido. Aguarde alguns minutos e tente novamente.'
        : error.message;
      return;
    }
    if (data.user && data.user.identities && data.user.identities.length === 0) {
      erroEl.textContent = 'Este e-mail já está cadastrado. Faça login.';
      return;
    }
    if (data.user) {
      await client.from('perfis').insert([{ id: data.user.id, email: data.user.email, is_admin: false }]);
    }
    toast('✓ Cadastro realizado! Faça login para continuar.');
    fecharModal();
    toggleModo();
  } else {
    const { error } = await client.auth.signInWithPassword({ email, password: senha });
    if (error) { erroEl.textContent = error.message; return; }
    toast('✓ Login realizado!');
    fecharModal();
  }
}

/* ── HEADER ── */
async function atualizarHeader() {
  const h = document.getElementById('header-user');
  if (!sessaoAtual) {
    h.innerHTML = `<button class="btn btn-login" onclick="abrirModal()">Entrar</button>`;
    return;
  }
  const nome = sessaoAtual.user.user_metadata?.nome || sessaoAtual.user.email;
  const { data } = await client.from('perfis').select('is_admin').eq('id', sessaoAtual.user.id).single();
  h.innerHTML = `
    <span class="user-greeting">Olá, <b>${nome}</b></span>
    ${data?.is_admin ? `<a href="adm.html" style="text-decoration:none"><button class="btn btn-adm">⚙ ADM</button></a>` : ''}
    <button class="btn btn-logout" onclick="logout()">Sair</button>
  `;
}

async function logout() {
  await client.auth.signOut();
  toast('Você saiu da conta.');
}

/* ── BUSCA ── */
document.getElementById('campo-busca').addEventListener('input', function () {
  const termo = this.value.trim();
  document.getElementById('btn-limpar').classList.toggle('visible', termo.length > 0);
  filtrar(termo);
});

function limparBusca() {
  document.getElementById('campo-busca').value = '';
  document.getElementById('btn-limpar').classList.remove('visible');
  filtrar('');
}

function filtrar(termo) {
  const sectionLabel = document.getElementById('section-label');
  const lista        = document.getElementById('lista-noticias');

  if (!termo) {
    sectionLabel.textContent = 'Últimas Notícias';
    renderizar(todasNoticias);
    return;
  }

  const t = termo.toLowerCase();
  const filtradas = todasNoticias.filter(n =>
    n.titulo.toLowerCase().includes(t) || n.conteudo.toLowerCase().includes(t)
  );

  sectionLabel.textContent = `Resultados para "${termo}"`;

  if (filtradas.length === 0) {
    document.getElementById('count-label').textContent = '0 resultados';
    lista.innerHTML = `
      <div class="no-result">
        <span>🔎</span>
        <p>Nenhum resultado para <b>"${termo}"</b></p>
      </div>`;
    return;
  }

  renderizar(filtradas);
}

/* ── RENDERIZAR — cards horizontais ── */
function formatarData(str) {
  if (!str) return '';
  return new Date(str).toLocaleDateString('pt-BR', { day:'numeric', month:'long', year:'numeric' });
}

function renderizar(noticias) {
  const lista      = document.getElementById('lista-noticias');
  const countLabel = document.getElementById('count-label');
  countLabel.textContent = `${noticias.length} publicaç${noticias.length === 1 ? 'ão' : 'ões'}`;

  lista.innerHTML = noticias.map(n => `
    <div class="card" onclick="abrirNoticia(${n.id})">
      <div class="card-thumb-wrap">
        ${n.imagem
          ? `<img class="card-thumb" src="${n.imagem}" alt="${n.titulo}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
             <div class="card-thumb-ph" style="display:none">📰</div>`
          : `<div class="card-thumb-ph">📰</div>`}
      </div>
      <div class="card-divider"></div>
      <div class="card-body">
        <span class="card-category">Notícia</span>
        <h3 class="card-title">${n.titulo}</h3>
        <p class="card-text">${n.conteudo}</p>
        <div class="card-footer">
          <span class="card-date">${formatarData(n.created_at) || 'Publicado recentemente'}</span>
          <span class="card-read">Ler →</span>
        </div>
      </div>
    </div>
  `).join('');
}

/* ── CARREGAR NOTÍCIAS ── */
async function carregarNoticias() {
  const { data, error } = await client.from('noticias').select('*').order('id', { ascending: false });

  document.getElementById('loading-state').style.display = 'none';
  const lista = document.getElementById('lista-noticias');
  lista.style.display = 'flex';

  if (error || !data || data.length === 0) {
    document.getElementById('count-label').textContent = '0 publicações';
    lista.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <h3>Nenhuma notícia publicada</h3>
        <p>Em breve novas publicações aparecerão aqui.</p>
      </div>`;
    return;
  }

  todasNoticias = data;
  renderizar(todasNoticias);
}

/* ── AUTH STATE ── */
client.auth.onAuthStateChange((event, session) => {
  sessaoAtual = session;
  atualizarHeader();
});

(async () => {
  const { data: { session } } = await client.auth.getSession();
  sessaoAtual = session;
  atualizarHeader();
  carregarNoticias();
})();
</script>
