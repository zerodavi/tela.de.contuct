<!-- ===================== index.html (PORTAL) ===================== -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portal de Notícias</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
body{font-family:'Lora',serif;background:#0d1117;color:#fff;margin:0}
header{background:#161b22;padding:15px;text-align:center;font-family:'Playfair Display',serif}
header h1{font-family:'Playfair Display',serif;font-size:2rem;margin:0 0 8px 0}
.header-nav{display:flex;justify-content:center;align-items:center;gap:15px;flex-wrap:wrap;margin-top:8px}
.container{padding:20px}
.card{background:#161b22;padding:15px;margin-bottom:15px;border-radius:10px;display:flex;gap:15px;align-items:flex-start;position:relative}
.card-texto{flex:1}
.card-texto h2{font-family:'Playfair Display',serif;font-size:1.2rem;margin:0 0 8px 0;line-height:1.4;color:#f0e6d3}
.card-texto p{font-family:'Lora',serif;font-size:0.9rem;color:#a8b4c0;line-height:1.7;margin:0}
img{width:120px;height:120px;object-fit:cover;border-radius:10px;flex-shrink:0}
a{color:#58a6ff;text-decoration:none;font-family:'Lora',serif}
.search-bar{display:flex;justify-content:center;padding:15px 20px 0}
.search-bar input{width:100%;max-width:600px;padding:10px 16px;border-radius:25px;border:1px solid #30363d;background:#161b22;color:#fff;font-family:'Lora',serif;font-size:0.95rem;outline:none;transition:border .2s}
.search-bar input:focus{border-color:#58a6ff}
.sem-resultado{text-align:center;color:#a8b4c0;font-family:'Lora',serif;margin-top:40px;font-style:italic}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;justify-content:center;align-items:center}
.modal-overlay.ativo{display:flex}
.modal{background:#161b22;border-radius:12px;padding:30px;width:100%;max-width:380px;border:1px solid #30363d}
.modal h2{font-family:'Playfair Display',serif;margin:0 0 20px 0;text-align:center}
.modal input{width:100%;padding:10px 14px;margin:8px 0;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#fff;font-family:'Lora',serif;font-size:0.95rem;box-sizing:border-box;outline:none}
.modal input:focus{border-color:#58a6ff}
.modal button{width:100%;padding:11px;margin-top:10px;border-radius:8px;border:none;font-family:'Lora',serif;font-size:1rem;cursor:pointer}
.btn-primary{background:#238636;color:#fff}
.btn-secondary{background:#21262d;color:#a8b4c0}
.modal-toggle{text-align:center;margin-top:12px;font-size:0.85rem;color:#a8b4c0}
.modal-toggle span{color:#58a6ff;cursor:pointer}
.modal-erro{color:#f85149;font-size:0.85rem;text-align:center;margin-top:8px;min-height:18px}

/* BOTÕES HEADER */
.btn-header{padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-family:'Lora',serif;font-size:0.85rem}
.btn-login{background:#238636;color:#fff}
.btn-logout{background:#21262d;color:#a8b4c0}
.btn-adm{background:#58a6ff;color:#0d1117;font-weight:bold}
.usuario-info{color:#a8b4c0;font-size:0.85rem}

/* BOTÃO EXCLUIR */
.btn-excluir{position:absolute;top:10px;right:10px;background:#da3633;color:#fff;border:none;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:0.8rem;font-family:'Lora',serif;display:none}
.btn-excluir:hover{background:#b62324}
.card.admin-mode .btn-excluir{display:block}

/* REDES SOCIAIS */
.social-bar{display:flex;justify-content:center;align-items:center;gap:18px;padding:14px;background:#161b22;border-top:1px solid #21262d;margin-top:40px}
.social-bar a{color:#a8b4c0;transition:color .2s;display:flex;align-items:center}
.social-bar a:hover{color:#58a6ff}
.social-bar svg{width:22px;height:22px;fill:currentColor}
footer{text-align:center;padding:12px;color:#4a5568;font-size:0.8rem;font-family:'Lora',serif;background:#161b22}
</style>
</head>
<body>

<header>
  <h1>📰 Portal de Notícias</h1>
  <div class="header-nav" id="header-nav">
    <button class="btn-header btn-login" onclick="abrirModal()">Entrar / Cadastrar</button>
  </div>
</header>

<div class="search-bar">
  <input type="text" id="pesquisa" placeholder="🔍 Pesquisar notícias por título..." oninput="filtrar()">
</div>
<div class="container" id="noticias"></div>

<!-- MODAL LOGIN / CADASTRO -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-titulo">Entrar</h2>
    <div id="campo-nome" style="display:none">
      <input type="text" id="inp-nome" placeholder="Seu nome completo">
    </div>
    <input type="text" id="inp-username" placeholder="Usuário">
    <input type="password" id="inp-senha" placeholder="Senha">
    <button class="btn-primary" onclick="submeter()">Confirmar</button>
    <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
    <p class="modal-erro" id="modal-erro"></p>
    <div class="modal-toggle">
      <span id="toggle-texto" onclick="alternarModo()">Não tem conta? Cadastre-se</span>
    </div>
  </div>
</div>

<script>
const client = supabase.createClient(
  "https://gqwcgaahjqklgmrswytb.supabase.co",
  "sb_publishable_bkCd5J8y1e4GszEv4S45yQ_YLZ48Wis"
);

let todasNoticias = [];
let modoCadastro = false;

/* -------- MODAL -------- */
function abrirModal(){
  document.getElementById('modal').classList.add('ativo');
  document.getElementById('modal-erro').textContent = '';
}
function fecharModal(){
  document.getElementById('modal').classList.remove('ativo');
  limparCampos();
}
function alternarModo(){
  modoCadastro = !modoCadastro;
  document.getElementById('modal-titulo').textContent = modoCadastro ? 'Cadastrar' : 'Entrar';
  document.getElementById('campo-nome').style.display = modoCadastro ? 'block' : 'none';
  document.getElementById('toggle-texto').textContent = modoCadastro ? 'Já tem conta? Faça login' : 'Não tem conta? Cadastre-se';
  document.getElementById('modal-erro').textContent = '';
}
function limparCampos(){
  ['inp-nome','inp-username','inp-senha'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('modal-erro').textContent = '';
}

async function submeter(){
  const username = document.getElementById('inp-username').value.trim();
  const senha    = document.getElementById('inp-senha').value.trim();
  const erro     = document.getElementById('modal-erro');

  if(!username || !senha){ erro.textContent = 'Preencha todos os campos.'; return; }

  if(modoCadastro){
    const nome = document.getElementById('inp-nome').value.trim();
    if(!nome){ erro.textContent = 'Informe seu nome.'; return; }

    const { data: existe } = await client.from('usuarios').select('id').eq('username', username).single();
    if(existe){ erro.textContent = 'Usuário já cadastrado.'; return; }

    const { error } = await client.from('usuarios').insert([{ nome, username, senha, is_admin: false }]);
    if(error){ erro.textContent = 'Erro ao cadastrar.'; return; }

    alert('Cadastro realizado! Faça login.');
    alternarModo();
    limparCampos();
  } else {
    const { data: user, error } = await client.from('usuarios')
      .select('*').eq('username', username).eq('senha', senha).single();

    if(error || !user){ erro.textContent = 'Usuário ou senha inválidos.'; return; }

    localStorage.setItem('usuario', JSON.stringify({ nome: user.nome, username: user.username, is_admin: user.is_admin }));
    fecharModal();
    atualizarHeader();
    renderizar(todasNoticias); // re-render para mostrar botões excluir
  }
}

/* -------- HEADER -------- */
function atualizarHeader(){
  const nav = document.getElementById('header-nav');
  const sessao = JSON.parse(localStorage.getItem('usuario'));

  if(!sessao){
    nav.innerHTML = `<button class="btn-header btn-login" onclick="abrirModal()">Entrar / Cadastrar</button>`;
    return;
  }

  const admBtn = sessao.is_admin
    ? `<a href="adm.html"><button class="btn-header btn-adm">⚙️ Painel ADM</button></a>`
    : '';

  nav.innerHTML = `
    <span class="usuario-info">Olá, <strong>${sessao.nome}</strong></span>
    ${admBtn}
    <button class="btn-header btn-logout" onclick="logout()">Sair</button>
  `;
}

function logout(){
  localStorage.removeItem('usuario');
  atualizarHeader();
  renderizar(todasNoticias);
}

/* -------- EXCLUIR NOTÍCIA -------- */
async function excluirNoticia(id){
  if(!confirm('Tem certeza que deseja excluir esta notícia?')) return;

  const { error } = await client.from('noticias').delete().eq('id', id);
  if(error){
    alert('Erro ao excluir: ' + error.message);
    return;
  }
  todasNoticias = todasNoticias.filter(n => n.id !== id);
  renderizar(todasNoticias);
}

/* -------- NOTÍCIAS -------- */
function renderizar(lista){
  const div = document.getElementById('noticias');
  const sessao = JSON.parse(localStorage.getItem('usuario'));
  const isAdmin = sessao && sessao.is_admin;

  div.innerHTML = '';
  if(lista.length === 0){
    div.innerHTML = '<p class="sem-resultado">Nenhuma notícia encontrada.</p>';
    return;
  }
  lista.forEach(n => {
    div.innerHTML += `
      <div class="card ${isAdmin ? 'admin-mode' : ''}">
        <img src="${n.imagem}" onerror="this.style.display='none'">
        <div class="card-texto">
          <h2>${n.titulo}</h2>
          <p>${n.conteudo}</p>
        </div>
        ${isAdmin ? `<button class="btn-excluir" onclick="excluirNoticia(${n.id})">🗑️ Excluir</button>` : ''}
      </div>
    `;
  });
}

function filtrar(){
  const termo = document.getElementById('pesquisa').value.toLowerCase();
  const filtradas = todasNoticias.filter(n => n.titulo.toLowerCase().includes(termo));
  renderizar(filtradas);
}

async function carregarNoticias(){
  const { data } = await client.from('noticias').select('*').order('id',{ascending:false});
  todasNoticias = data || [];
  renderizar(todasNoticias);
}

document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === this) fecharModal();
});

atualizarHeader();
carregarNoticias();
</script>
</body>
</html>
